name: 앱 만들기 (APK)

on:
  push:
    branches: [main]
    paths-ignore:
      - "promo/**"
      - ".github/workflows/shorts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 파일 가져오기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 앱 재료 설치
        run: npm install --no-audit --no-fund

      - name: 안드로이드 프로젝트 만들기
        run: |
          npx cap add android
          npx cap sync android

      - name: 고정 서명 키 넣기 (업데이트할 때 앱을 안 지워도 되게)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../hongmyeongguk.apk

      - name: APK 내려받기 준비
        uses: actions/upload-artifact@v4
        with:
          name: hongmyeongguk-apk
          path: hongmyeongguk.apk

      - name: 휴대폰 다운로드 링크에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 귀문 명국 ${{ github.run_number }}번째 버전
          files: hongmyeongguk.apk
          make_latest: true
