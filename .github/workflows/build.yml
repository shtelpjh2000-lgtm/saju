name: 앱 만들기 (APK)

on:
  push:
    branches: [main]
    paths-ignore:
      - "promo/**"
      - ".github/workflows/shorts.yml"
      - "store/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: 파일 가져오기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 빌드 도구 저장해 두고 다시 쓰기
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-v1
          restore-keys: gradle-${{ runner.os }}-

      - name: 앱 재료 설치
        run: npm install --no-audit --no-fund

      - name: 안드로이드 프로젝트 만들기
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          mkdir -p android/app/src/main/res/drawable
          cp assets/ic_stat_star.png android/app/src/main/res/drawable/ic_stat_star.png
          npx cap sync android
          # 정확한 알람 권한은 빼요 (구글 플레이 심사 대상, 일진 알림은 몇 분 오차면 충분)
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" tools:node="remove" />|' android/app/src/main/AndroidManifest.xml
          head -4 android/app/src/main/AndroidManifest.xml
          # 버전 번호를 빌드 번호로 올려서 업데이트가 되게 해요
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: 고정 서명 키 넣기 (업데이트할 때 앱을 안 지워도 되게)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          # 빌드 도구 내려받기가 끊기면 최대 6번, 점점 길게 기다리며 다시 시도해요
          for i in 1 2 3 4 5 6; do ./gradlew --version --no-daemon && break; echo "다시 시도 $i"; sleep $((i*30)); done
          # 고정 서명 키로 직접 서명해요 (업데이트할 때 앱을 지우지 않아도 되게)
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          # 서명이 고정 키와 같은지 확인하고, 다르면 빌드를 멈춰요
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/certs.txt
          grep -qi "SHA-256 digest: f93ac10d554c1310" /tmp/certs.txt || { echo "서명이 고정 키와 달라요"; exit 1; }
          cp app/build/outputs/apk/debug/app-debug.apk ../hongmyeongguk.apk

      - name: APK 내려받기 준비
        uses: actions/upload-artifact@v4
        with:
          name: hongmyeongguk-apk
          path: hongmyeongguk.apk

      - name: 휴대폰 다운로드 링크에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 귀문 명국 ${{ github.run_number }}번째 버전
          files: hongmyeongguk.apk
          make_latest: true

      - name: 구글 플레이용 AAB 만들기 (업로드 키가 있을 때만)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$UPLOAD_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$UPLOAD_KEYSTORE_PASSWORD"
          cp app/build/outputs/bundle/release/app-release.aab ../gwimun-${{ github.run_number }}.aab

      - name: AAB 내려받기 준비
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: google-play-aab
          path: gwimun-*.aab
