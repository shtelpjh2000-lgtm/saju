name: 운세 쇼츠 만들고 올리기

on:
  schedule:
    - cron: "7 22 * * *"   # 매일 아침 7시 7분 (한국 시간)
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 (비우면 오늘, 예: 2026-11-10)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  shorts:
    runs-on: ubuntu-latest
    steps:
      - name: 파일 가져오기
        uses: actions/checkout@v4

      - name: 글꼴과 영상 도구 설치
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji ffmpeg

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 재료 설치
        run: pip install numpy pillow requests google-api-python-client google-auth

      - name: 오늘의 운세 영상 만들기
        working-directory: promo
        run: python make_video.py "${{ github.event.inputs.date }}" out

      - name: 날짜 이름 정하기
        id: day
        run: |
          echo "tag=shorts-$(TZ=Asia/Seoul date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "title=$(head -n1 promo/out/title.txt | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: 영상 보관함에 올리기 (휴대폰에서도 받을 수 있게)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.day.outputs.tag }}
          name: ${{ steps.day.outputs.title }}
          body_path: promo/out/caption.txt
          files: |
            promo/out/shorts.mp4
            promo/out/thumb.jpg
          prerelease: true
          make_latest: false

      - name: 유튜브 쇼츠 올리기
        working-directory: promo
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python upload_youtube.py out

      - name: 인스타그램 릴스 올리기
        if: always()
        working-directory: promo
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_HOST: ${{ secrets.IG_API_HOST }}
        run: python upload_instagram.py out

      - name: 인스타그램 토큰 연장 (60일 만료 방지)
        if: always()
        working-directory: promo
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ secrets.IG_API_HOST }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python refresh_instagram_token.py new_token.txt
          if [ -s new_token.txt ]; then
            if [ -n "$GH_TOKEN" ]; then
              gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < new_token.txt
              echo "IG_ACCESS_TOKEN Secret을 새 토큰으로 바꿨어요"
            else
              echo "새 토큰이 나왔지만 GH_PAT가 없어서 Secret을 못 바꿨어요"
            fi
            rm -f new_token.txt
          fi
